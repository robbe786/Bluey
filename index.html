<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Poker Assistant 360°</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #121212; color: #fff; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    #camera-container { flex: 1 1 auto; min-height: 0; position: relative; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    #overlay-box { 
      position: absolute; 
      border: 2px dashed rgba(255,255,255,0.7); 
      width: 96%; 
      height: 40%; 
      pointer-events: none; 
      border-radius: 8px; 
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.6); 
    }
    
    #result-panel { flex: 0 0 auto; background: #1a1a1a; padding: 12px 16px 20px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; border-top: 2px solid #333; }
    #decision { font-size: 1.8rem; font-weight: 900; text-align: center; letter-spacing: 1px; color: #888; }
    #details { font-size: 0.9rem; color: #ccc; width: 100%; text-align: left; line-height: 1.45; min-height: 2.8em; }
    #btn-action { width: 100%; padding: 16px; font-size: 1.2rem; font-weight: bold; color: white; background: #2563eb; border: none; border-radius: 12px; cursor: pointer; touch-action: manipulation; }
    #btn-action:active { background: #1d4ed8; }
    #btn-action:disabled { background: #444; color: #888; cursor: not-allowed; }

    .poker-card {
      display: inline-block;
      font-weight: 800;
      padding: 1px 6px;
      margin: 0 2px;
      border-radius: 4px;
      background: #262626;
      border: 1px solid #404040;
      letter-spacing: 0.5px;
    }
    .card-d { color: #38bdf8 !important; }
    .card-c { color: #22c55e !important; }
    .card-h { color: #ef4444 !important; }
    .card-s { color: #f8fafc !important; }

    .status-raise { color: #3b82f6 !important; }
    .status-call { color: #10b981 !important; }
    .status-fold { color: #ef4444 !important; }

    #api-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: flex; justify-content: center; align-items: center; padding: 20px; z-index: 100; }
    .modal-content { background: #222; padding: 20px; border-radius: 12px; width: 100%; max-width: 350px; border: 1px solid #333; }
    .modal-content input { width: 100%; padding: 12px; margin: 12px 0; border-radius: 6px; border: 1px solid #444; background: #111; color: white; font-size: 0.95rem; }
    .modal-content button { width: 100%; padding: 12px; background: #2563eb; border: none; border-radius: 6px; color: white; font-weight: bold; font-size: 1rem; }
  </style>
</head>
<body>

  <div id="api-modal">
    <div class="modal-content">
      <h3 style="font-size: 1.1rem;">Inserisci Gemini API Key</h3>
      <input type="text" id="api-key-input" placeholder="Incolla chiave AQ...">
      <button id="save-key-btn">Salva e Avvia</button>
    </div>
  </div>

  <div id="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <div id="overlay-box"></div>
  </div>

  <div id="result-panel">
    <div id="decision">IN ATTESA</div>
    <div id="details">Inquadra il tavolo nel riquadro panoramico.</div>
    <button id="btn-action">SCATTA E DECIDI</button>
  </div>

  <canvas id="canvas" style="display: none;"></canvas>

  <script>
    const SYSTEM_PROMPT = `Sei un coach infallibile di Spin & Go (target: 75-80 ChipEV/t).
L'immagine ritagliata è uno scatto RAW ad alta risoluzione del tavolo da poker su feltro scuro.

ANALISI OTTICA DELLA SITUAZIONE DI GIOCO:
1. CARTE DI HERO (in basso al centro sopra Bluey4):
   - Per ENTRAMBE le carte, LEGGI VALORE E SEME ESCLUSIVAMENTE DALL'INDICE NELL'ANGOLO IN ALTO A SINISTRA.
   - REGOLA 4 COLORI: BLU=Quadri (♦/d), VERDE=Fiori (♣/c), ROSSO=Cuori (♥/h), NERO=Picche (♠/s).
2. BOARD AL CENTRO: Stessa regola a 4 colori (stringa vuota "" se pre-flop).
3. RILEVAMENTO PUNTATE:
   - Sul bordo del tavolo, SUBITO A FIANCO DI CIASCUN BADGE GIOCATORE, rileva la pila di fiches con la cifra in BB.
   - Calcola quanto costa a Hero fare CALL (differenza tra la puntata massima avversaria e le chip già messe da Hero).
4. POT TOTALE, STACK in BB e HUD Hand2Note (Alto=[Hands, VPIP] | Basso=[PFR, FCB]).

REGOLE MATEMATICHE COGENTI (NO PASSIVITÀ, NO LIMP-FOLDING):
1. PRE-FLOP DA SMALL BLIND (< 8 BB EFFETTIVI):
   - PUSH O FOLD RIGIDO: È VIETATO FARE LIMP / CALL DA SMALL BLIND.
   - OPEN-SHOVE (ALL-IN): Ax, Kx, coppie, Q6o+, Q2s+, J7o+, J4s+, T7o+, T6s+, 96s+, 87s.
   - FOLD DIRETTO: Tutte le mani spazzatura offsuit o non connesse (es. 83s, 72o, 93o, T2o, J3o, Q2o-Q5o). MAI completare il mezzo buio con trash.
2. PRE-FLOP DA BIG BLIND CONTRO LIMP (< 8 BB EFFETTIVI):
   - ISO-SHOVE (ALL-IN) con Ax, Kx, Q9o+, Q6s+, coppie (anche 77, 66, ecc.), broadway (es. KJs, KTs, QJs).
   - CHECK GRATUITO consentito SOLO con spazzatura pura (es. 83o, T4o).
3. RISPOSTA AD ALL-IN AVVERSARIO (SHOVE) O RILANCI PRE-FLOP:
   - Se per chiamare mancano > 2 BB: CHIAMA SOLO con mani di valore legittimo (Ax, KTs+, QJs+, coppie 55+). FOLD ASSOLUTO con spazzatura (es. 83s, J3o, Q2o).
   - La regola "CALL 100% (Any Two Cards)" si applica SOLO ED ESCLUSIVAMENTE se per chiamare mancano letteralmente <= 1.5 BB (pot odds matematicamente irrinunciabili).
4. DIVIETO DI PEEL/FLOATING POST-FLOP (< 6 BB):
   - Se un oppo punta e Hero non ha almeno Top Pair, Second Pair con buon kicker o draw a 8+ out (bilaterale o colore a 4 quinti), FOLD IMMEDIATO. MAI chiamare Flop e Turn con sola carta alta o coppie marginali per poi foldare dopo dissanguando lo stack.
5. HUD EXPLOIT:
   - Calling Station (VPIP >= 55%, diff >= 25) -> no bluff, 3 strade di valore pesanti.
   - Nit (VPIP <= 24%, o FCB >= 60% solo se Hands >= 25) -> c-bet 100% e steal allargato. Ignora FCB se Hands < 25.

RISPONDI ESCLUSIVAMENTE IN JSON VALIDO (senza backtick o markdown):
{
  "mossa": "AZIONE CON SIZING",
  "mie_carte": "Valore e seme Hero (es: '8c 3c')",
  "board": "Carte board o stringa vuota",
  "dettaglio_tavolo": "Puntate rilevate + costo call BB + HUD sintesi"
}`;

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const btnAction = document.getElementById('btn-action');
    const decisionEl = document.getElementById('decision');
    const detailsEl = document.getElementById('details');
    const apiModal = document.getElementById('api-modal');
    const apiKeyInput = document.getElementById('api-key-input');
    const saveKeyBtn = document.getElementById('save-key-btn');

    let apiKey = localStorage.getItem('GEMINI_API_KEY') || '';
    let imageCapture = null;

    if (apiKey) {
      apiModal.style.display = 'none';
      startCamera();
    }

    saveKeyBtn.onclick = () => {
      apiKey = apiKeyInput.value.trim();
      if (apiKey) {
        localStorage.setItem('GEMINI_API_KEY', apiKey);
        apiModal.style.display = 'none';
        startCamera();
      }
    };

    function formatPokerCards(cardString) {
      if (!cardString || typeof cardString !== 'string') return '';
      return cardString.replace(/\b([AKQJT0-9]{1,2})([shdc])\b/gi, (match, val, suit) => {
        const s = suit.toLowerCase();
        let suitSymbol = s;
        if (s === 'd') suitSymbol = '♦';
        else if (s === 'c') suitSymbol = '♣';
        else if (s === 'h') suitSymbol = '♥';
        else if (s === 's') suitSymbol = '♠';
        return `<span class="poker-card card-${s}">${val.toUpperCase()}${suitSymbol}</span>`;
      });
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { 
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920, min: 1280 },
            height: { ideal: 1080, min: 720 },
            advanced: [
              { focusMode: 'continuous' },
              { exposureMode: 'continuous' }
            ]
          },
          audio: false
        });

        video.srcObject = stream;
        video.setAttribute("playsinline", true);
        await video.play();

        const track = stream.getVideoTracks()[0];
        if ('ImageCapture' in window && track) {
          imageCapture = new ImageCapture(track);
        }
      } catch (err) {
        alert("Errore fotocamera: " + err.message);
      }
    }

    btnAction.onclick = async () => {
      if (!apiKey) {
        apiModal.style.display = 'flex';
        return;
      }

      if (!video.videoWidth) return;

      btnAction.disabled = true;
      btnAction.innerText = "SCATTO RAW...";
      decisionEl.innerText = "ELABORAZIONE...";
      decisionEl.className = "";

      let sourceImageBitmap;

      try {
        if (imageCapture) {
          const blob = await imageCapture.takePhoto({
            imageWidth: 4000,
            imageHeight: 3000
          }).catch(() => imageCapture.takePhoto());
          
          sourceImageBitmap = await createImageBitmap(blob);
        } else {
          sourceImageBitmap = video;
        }

        const srcWidth = sourceImageBitmap.width || video.videoWidth;
        const srcHeight = sourceImageBitmap.height || video.videoHeight;

        // Larghezza al 96% per prendere tutto il tavolo da sinistra a destra
        // Altezza al 40% per escludere bordi superiore/inferiore
        const cropW = srcWidth * 0.96;
        const cropH = srcHeight * 0.40;
        const cropX = (srcWidth - cropW) / 2;
        const cropY = (srcHeight - cropH) / 2;

        const targetWidth = 2400;
        canvas.width = targetWidth;
        canvas.height = (cropH / cropW) * targetWidth;

        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        ctx.drawImage(sourceImageBitmap, cropX, cropY, cropW, cropH, 0, 0, canvas.width, canvas.height);
        
        if (sourceImageBitmap.close) {
          sourceImageBitmap.close();
        }

        const base64Image = canvas.toDataURL('image/jpeg', 0.95).split(',')[1];

        btnAction.innerText = "ANALISI AI...";

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              role: "user",
              parts: [
                { text: SYSTEM_PROMPT },
                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
              ]
            }],
            generationConfig: {
              response_mime_type: "application/json",
              temperature: 0.0,
              max_output_tokens: 300,
              thinking_config: { thinking_budget: 0 }
            }
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message || "Errore API");

        let outputText = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (outputText) {
          outputText = outputText.replace(/```json/gi, '').replace(/```/g, '').trim();
          let parsed;
          try {
            parsed = JSON.parse(outputText);
          } catch (e) {
            parsed = { mossa: "RIPETI SCATTO", mie_carte: "Lettura incerta", board: "", dettaglio_tavolo: outputText.slice(0, 70) };
          }

          decisionEl.innerText = parsed.mossa || "INFO";

          const coloredHero = parsed.mie_carte ? formatPokerCards(parsed.mie_carte) : 'NON RILEVATE';
          const coloredBoard = parsed.board ? formatPokerCards(parsed.board) : '<span style="color:#666;">Nessuno (Pre-Flop)</span>';

          detailsEl.innerHTML = `
            • <b>HERO:</b> [ ${coloredHero} ]<br>
            • <b>BOARD:</b> [ ${coloredBoard} ]<br>
            • ${parsed.dettaglio_tavolo || ''}
          `;

          const action = (parsed.mossa || '').toUpperCase();
          if (action.includes("ALL-IN") || action.includes("RAISE") || action.includes("C-BET")) {
            decisionEl.className = "status-raise";
          } else if (action.includes("CHECK") || action.includes("CALL")) {
            decisionEl.className = "status-call";
          } else if (action.includes("FOLD")) {
            decisionEl.className = "status-fold";
          } else {
            decisionEl.className = "";
          }
        } else {
          decisionEl.innerText = "ERRORE";
          detailsEl.innerText = "Nessuna risposta dal modello.";
        }
      } catch (err) {
        decisionEl.innerText = "ERRORE";
        detailsEl.innerText = err.message;
      } finally {
        btnAction.disabled = false;
        btnAction.innerText = "SCATTA E DECIDI";
      }
    };

    window.addEventListener('keydown', (e) => {
      if (
        e.code === 'Space' || 
        e.code === 'Enter' || 
        e.key === 'Enter' || 
        e.key === ' ' || 
        e.code.startsWith('Numpad') ||
        e.key === 'VolumeUp' || 
        e.key === 'VolumeDown'
      ) {
        e.preventDefault();
        if (!btnAction.disabled) btnAction.click();
      }
    });

    window.addEventListener('click', (e) => {
      if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON' && !btnAction.disabled) {
        btnAction.click();
      }
    });
  </script>
</body>
</html>
