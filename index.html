<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spin & Go Vision Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    body { background: #000; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    #video-container { position: relative; flex: 1; background: #111; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: cover; }
    canvas { display: none; }

    #controls { padding: 12px; background: #0a0a0a; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #222; }
    .api-box { display: flex; gap: 8px; }
    input { flex: 1; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 6px; font-size: 14px; }
    
    button#snap-btn {
      background: #00c853; color: #000; font-weight: 900; font-size: 18px; padding: 16px; border: none; border-radius: 8px;
      text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: background 0.1s;
    }
    button#snap-btn:active { background: #009624; }
    button#snap-btn:disabled { background: #444; color: #888; }

    #output-panel { padding: 14px; background: #050505; border-top: 2px solid #333; min-height: 160px; display: flex; flex-direction: column; justify-content: space-between; }
    .action-display { display: flex; align-items: baseline; justify-content: space-between; }
    .action-badge { font-size: 28px; font-weight: 900; color: #ffeb3b; }
    .profile-badge { font-size: 13px; font-weight: bold; background: #222; padding: 4px 8px; border-radius: 4px; color: #aaa; }
    
    .hud-stats { display: flex; gap: 12px; margin: 8px 0; font-size: 12px; background: #111; padding: 8px; border-radius: 6px; border: 1px solid #222; }
    .hud-col { flex: 1; line-height: 1.4; }
    .hud-title { color: #888; text-transform: uppercase; font-size: 10px; margin-bottom: 2px; }

    .rationale { font-size: 13px; color: #bbb; line-height: 1.3; font-style: italic; }
    .latency-tag { font-size: 10px; color: #555; text-align: right; margin-top: 4px; }
  </style>
</head>
<body>

  <div id="video-container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="frame-canvas"></canvas>
  </div>

  <div id="controls">
    <div class="api-box">
      <input type="password" id="api-key" placeholder="Incolla Gemini API Key" />
    </div>
    <button id="snap-btn">Elabora Spot</button>
  </div>

  <div id="output-panel">
    <div class="action-display">
      <span class="action-badge" id="display-action">IN ATTESA</span>
      <span class="profile-badge" id="display-profile">NESSUN DATO</span>
    </div>
    
    <div class="hud-stats" id="display-hud">
      <div class="hud-col">
        <div class="hud-title">Opponent 1 (HUD)</div>
        <div id="hud-opp1">H: - | V: - | P: - | F: -</div>
      </div>
      <div class="hud-col">
        <div class="hud-title">Opponent 2 (HUD)</div>
        <div id="hud-opp2">H: - | V: - | P: - | F: -</div>
      </div>
    </div>

    <div class="rationale" id="display-rationale">Inquadra il tavolo e premi 'Elabora Spot'.</div>
    <div class="latency-tag" id="display-latency">Latenza: 0 ms</div>
  </div>

  <script>
    const SYSTEM_PROMPT = `Sei un solutore real-time d'élite per tornei Spin & Go 3-max (target: 75-85 ChipEV/t).
Analizza il frame video per rilevare: carte di Hero, board, piatti, stack esatti (in BB) e i box HUD degli avversari.

REGOLA DI LETTURA HUD (Griglia 2x2 scura posizionata sotto o vicino agli avversari):
- In alto a sinistra: HANDS (Numero mani giocate)
- In alto a destra: VPIP (% mani giocate)
- In basso a sinistra: PFR (% rilanci pre-flop)
- In basso a destra: FCB (Fold to Flop C-Bet %)

EURISTICA DI EXPLOIT (se Hands >= 8):
1. CALLING STATION / FISH PASSIVO (VPIP >= 38% con divario VPIP-PFR >= 20, oppure FCB <= 35%):
   - POST-FLOP: Elimina categoricamente bluff e c-bet con aria totale.
   - VALORE: Punta o rilancia forte (overbet / 66%+ pot) con Made Hand o Top Pair; estrai 3 strade di valore pieno.
   - PRE-FLOP: Isola i suoi limp con range lineare solido, evita steal marginali.
2. NIT / FIT-OR-FOLD (VPIP <= 18%, oppure FCB >= 58%):
   - POST-FLOP: C-bet sistematica al 100% (size 25-33% pot) su qualsiasi texture se sei l'aggressore preflop.
   - PRE-FLOP: Allarga sensibilmente lo steal da BTN/SB contro il suo BB.
3. REGOLARE (VPIP 22-32%, PFR bilanciato): Applica strategie GTO Spin & Go baseline.
4. UNKNOWN (Hands < 8): Adotta linee GTO standard basate unicamente su profondità stack in BB.
REGOLA GENERALE SULLE AGGRESSIONI: A fronte di un raise avversario al River, folda sistematicamente senza punto nullo/nuts.

Rispondi ESCLUSIVAMENTE con un file JSON valido conforme allo schema.`;

    const JSON_SCHEMA = {
      type: "OBJECT",
      properties: {
        hud_readings: {
          type: "OBJECT",
          properties: {
            opp1: {
              type: "OBJECT",
              properties: {
                hands: { type: "INTEGER" },
                vpip: { type: "INTEGER" },
                pfr: { type: "INTEGER" },
                fcb: { type: "INTEGER" }
              },
              required: ["hands", "vpip", "pfr", "fcb"]
            },
            opp2: {
              type: "OBJECT",
              properties: {
                hands: { type: "INTEGER" },
                vpip: { type: "INTEGER" },
                pfr: { type: "INTEGER" },
                fcb: { type: "INTEGER" }
              },
              required: ["hands", "vpip", "pfr", "fcb"]
            }
          },
          required: ["opp1", "opp2"]
        },
        opponent_profile: { type: "STRING" },
        action: { type: "STRING" },
        rationale: { type: "STRING" }
      },
      required: ["hud_readings", "opponent_profile", "action", "rationale"]
    };

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('frame-canvas');
    const snapBtn = document.getElementById('snap-btn');
    const apiKeyInput = document.getElementById('api-key');

    const displayAction = document.getElementById('display-action');
    const displayProfile = document.getElementById('display-profile');
    const displayOpp1 = document.getElementById('hud-opp1');
    const displayOpp2 = document.getElementById('hud-opp2');
    const displayRationale = document.getElementById('display-rationale');
    const displayLatency = document.getElementById('display-latency');

    if (localStorage.getItem('gemini_api_key')) {
      apiKeyInput.value = localStorage.getItem('gemini_api_key');
    }

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'environment',
            width: { ideal: 1280 },
            height: { ideal: 720 },
            focusMode: { ideal: 'continuous' }
          },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        console.error("Errore fotocamera:", err);
        displayRationale.textContent = "Errore apertura webcam: accertati di eseguire su HTTPS o localhost.";
      }
    }

    function captureBase64() {
      canvas.width = 1280;
      canvas.height = 720;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', 0.82).split(',')[1];
    }

    async function evaluateSpot() {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        alert("Inserisci la Gemini API Key");
        return;
      }
      localStorage.setItem('gemini_api_key', apiKey);

      snapBtn.disabled = true;
      displayAction.textContent = "CALCOLO...";
      displayAction.style.color = "#ffeb3b";
      const startTime = performance.now();

      try {
        const base64Image = captureBase64();
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
        const payload = {
          contents: [
            {
              role: "user",
              parts: [
                { text: "Analizza questo stato di gioco. Estrai le metriche HUD ed esegui la mossa ad alto ChipEV." },
                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
              ]
            }
          ],
          systemInstruction: {
            parts: [{ text: SYSTEM_PROMPT }]
          },
          generationConfig: {
            temperature: 0.0,
            responseMimeType: "application/json",
            responseSchema: JSON_SCHEMA
          }
        };

        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || "Errore HTTP " + response.status);
        }

        const data = await response.json();
        const latency = Math.round(performance.now() - startTime);
        displayLatency.textContent = `Latenza: ${latency} ms`;

        const parsedResult = JSON.parse(data.candidates[0].content.parts[0].text);

        displayAction.textContent = parsedResult.action;
        displayAction.style.color = parsedResult.action.includes("FOLD") ? "#f44336" : "#00e676";
        displayProfile.textContent = parsedResult.opponent_profile;
        
        displayOpp1.textContent = `H: ${parsedResult.hud_readings.opp1.hands} | V: ${parsedResult.hud_readings.opp1.vpip}% | P: ${parsedResult.hud_readings.opp1.pfr}% | F: ${parsedResult.hud_readings.opp1.fcb}%`;
        displayOpp2.textContent = `H: ${parsedResult.hud_readings.opp2.hands} | V: ${parsedResult.hud_readings.opp2.vpip}% | P: ${parsedResult.hud_readings.opp2.pfr}% | F: ${parsedResult.hud_readings.opp2.fcb}%`;

        displayRationale.textContent = parsedResult.rationale;

      } catch (err) {
        console.error(err);
        displayAction.textContent = "ERRORE";
        displayAction.style.color = "#f44336";
        displayRationale.textContent = err.message;
      } finally {
        snapBtn.disabled = false;
      }
    }

    snapBtn.addEventListener('click', evaluateSpot);
    window.addEventListener('load', initCamera);
  </script>
</body>
</html>
