<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Poker Assistant 360°</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    body { 
      background-color: #121212; 
      color: #fff; 
      height: 100vh;
      height: 100dvh;
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
    }

    #camera-container { 
      flex: 1 1 auto; 
      min-height: 0;
      position: relative; 
      background: #000; 
      overflow: hidden; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
    }

    video { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
    }

    #overlay-box { 
      position: absolute; 
      border: 2px dashed rgba(255,255,255,0.4); 
      width: 85%; 
      height: 65%; 
      pointer-events: none; 
      border-radius: 8px; 
    }

    #result-panel { 
      flex: 0 0 auto;
      background: #1a1a1a; 
      padding: 12px 16px 20px 16px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 10px;
      border-top: 2px solid #333; 
    }

    #decision { 
      font-size: 1.8rem; 
      font-weight: 900; 
      text-align: center; 
      letter-spacing: 1px; 
      color: #888; 
    }

    #details { 
      font-size: 0.85rem; 
      color: #ccc; 
      width: 100%; 
      text-align: left; 
      line-height: 1.35; 
      min-height: 2.8em;
    }

    #btn-action { 
      width: 100%; 
      padding: 16px; 
      font-size: 1.2rem; 
      font-weight: bold; 
      color: white; 
      background: #2563eb; 
      border: none; 
      border-radius: 12px; 
      cursor: pointer; 
      touch-action: manipulation;
    }

    #btn-action:active { background: #1d4ed8; }
    #btn-action:disabled { background: #444; color: #888; cursor: not-allowed; }

    .status-raise { color: #3b82f6 !important; }
    .status-call { color: #10b981 !important; }
    .status-fold { color: #ef4444 !important; }

    #api-modal { 
      position: fixed; 
      inset: 0; 
      background: rgba(0,0,0,0.92); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      padding: 20px; 
      z-index: 100; 
    }

    .modal-content { 
      background: #222; 
      padding: 20px; 
      border-radius: 12px; 
      width: 100%; 
      max-width: 350px; 
      border: 1px solid #333;
    }

    .modal-content input { 
      width: 100%; 
      padding: 12px; 
      margin: 12px 0; 
      border-radius: 6px; 
      border: 1px solid #444; 
      background: #111; 
      color: white; 
      font-size: 0.95rem;
    }

    .modal-content button { 
      width: 100%; 
      padding: 12px; 
      background: #2563eb; 
      border: none; 
      border-radius: 6px; 
      color: white; 
      font-weight: bold; 
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div id="api-modal">
    <div class="modal-content">
      <h3 style="font-size: 1.1rem;">Inserisci Gemini API Key</h3>
      <input type="text" id="api-key-input" placeholder="Incolla chiave AQ...">
      <button id="save-key-btn">Salva e Avvia</button>
    </div>
  </div>

  <div id="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <div id="overlay-box"></div>
  </div>

  <div id="result-panel">
    <div id="decision">IN ATTESA</div>
    <div id="details">Inquadra il tavolo e premi il pulsante o usa tastiera/mouse.</div>
    <button id="btn-action">SCATTA E DECIDI</button>
  </div>

  <canvas id="canvas" style="display: none;"></canvas>

  <script>
    const SYSTEM_PROMPT = `Sei un coach infallibile di Spin & Go (target: 75-80 ChipEV/t).
Analizza con estrema precisione ottica:
1. LE DUE CARTE DI HERO in basso al centro (valore e seme: s=picche, h=cuori, d=quadri, c=fiori). Fai attenzione: il mazzo a 4 colori usa Picche=Nero, Cuori=Rosso, Quadri=Blu, Fiori=Verde.
2. Carte comuni del board (se presenti).
3. Stack residuo di Hero in BB, piatto in BB e fase (3-Handed o Heads-Up).
4. Griglia HUD 2x2 avversari (In alto: Hands, VPIP | In basso: PFR, FCB).

REGOLE DI GIOCO:
1. POT ODDS ESTREME: se un oppo va all-in e mancano <= 1.5 BB per chiamare (o equity <= 25%), CALL col 100% delle carte (Any Two Cards).
2. EXPLOIT HUD:
   - Calling Station (VPIP >= 55% e VPIP-PFR >= 25): no bluff, 3 strade di valore pesanti con top pair+.
   - Nit (VPIP <= 24%, o FCB >= 60% solo se Hands >= 25): c-bet 100% da aggressore e steal allargato.
   - Ignora FCB se Hands < 25.
3. PRE-FLOP:
   - Sotto 8 BB: tabelle Push/Fold matematiche.
   - 8-12 BB in Heads-Up: open-shove diretto con mani speculative/coppie medie; min-raise solo con top range pronto al call. Mai min-raise/fold a <12 BB in HU.
   - > 8 BB in 3-Handed: min-raise standard.
4. RIVER: FOLD a qualsiasi raise/shove senza nuts assoluto.

FORMATO OUTPUT: Rispondi SEMPRE ed ESCLUSIVAMENTE in JSON valido senza backtick o markdown:
{
  "mossa": "AZIONE CON SIZING",
  "mie_carte": "Valore e seme delle carte in mano (es: 'Ad Kh' o '7s 8s')",
  "dettaglio_tavolo": "Board + HUD avversari o motivazione sintetica"
}`;

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const btnAction = document.getElementById('btn-action');
    const decisionEl = document.getElementById('decision');
    const detailsEl = document.getElementById('details');
    const apiModal = document.getElementById('api-modal');
    const apiKeyInput = document.getElementById('api-key-input');
    const saveKeyBtn = document.getElementById('save-key-btn');

    let apiKey = localStorage.getItem('GEMINI_API_KEY') || '';

    if (apiKey) {
      apiModal.style.display = 'none';
      startCamera();
    }

    saveKeyBtn.onclick = () => {
      apiKey = apiKeyInput.value.trim();
      if (apiKey) {
        localStorage.setItem('GEMINI_API_KEY', apiKey);
        apiModal.style.display = 'none';
        startCamera();
      }
    };

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { 
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920, min: 1280 },
            height: { ideal: 1080, min: 720 },
            focusMode: { ideal: 'continuous' }
          },
          audio: false
        });
        video.srcObject = stream;
        video.setAttribute("playsinline", true);
        await video.play();
      } catch (err) {
        alert("Errore fotocamera: " + err.message);
      }
    }

    btnAction.onclick = async () => {
      if (!apiKey) {
        apiModal.style.display = 'flex';
        return;
      }

      if (!video.videoWidth) {
        alert("Attendi che il video si sia avviato.");
        return;
      }

      btnAction.disabled = true;
      btnAction.innerText = "ANALISI...";
      decisionEl.innerText = "ELABORAZIONE...";
      decisionEl.className = "";

      const targetWidth = 1280;
      canvas.width = targetWidth;
      canvas.height = (video.videoHeight / video.videoWidth) * targetWidth;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const base64Image = canvas.toDataURL('image/jpeg', 0.80).split(',')[1];

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              role: "user",
              parts: [
                { text: SYSTEM_PROMPT },
                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
              ]
            }],
            generationConfig: {
              response_mime_type: "application/json",
              temperature: 0.1,
              max_output_tokens: 250,
              thinking_config: {
                thinking_budget: 0
              }
            }
          })
        });

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error.message || "Errore API");
        }

        let outputText = data.candidates?.[0]?.content?.parts?.[0]?.text;
        
        if (outputText) {
          outputText = outputText.replace(/```json/gi, '').replace(/```/g, '').trim();
          
          let parsed;
          try {
            parsed = JSON.parse(outputText);
          } catch (e) {
            parsed = {
              mossa: "RIPETI SCATTO",
              mie_carte: "Lettura incerta",
              dettaglio_tavolo: outputText.slice(0, 70)
            };
          }

          decisionEl.innerText = parsed.mossa || "INFO";
          
          // Prima riga: CARTE IN MANO ben visibili | Seconda riga: Dettagli/HUD
          const heroCards = parsed.mie_carte ? `<b style="color: #60a5fa;">CARTE HERO: [ ${parsed.mie_carte} ]</b>` : 'CARTE NON RILEVATE';
          detailsEl.innerHTML = `• ${heroCards}<br>• ${parsed.dettaglio_tavolo || ''}`;

          const action = (parsed.mossa || '').toUpperCase();
          if (action.includes("ALL-IN") || action.includes("RAISE") || action.includes("C-BET")) {
            decisionEl.className = "status-raise";
          } else if (action.includes("CHECK") || action.includes("CALL")) {
            decisionEl.className = "status-call";
          } else if (action.includes("FOLD")) {
            decisionEl.className = "status-fold";
          } else {
            decisionEl.className = "";
          }
        } else {
          decisionEl.innerText = "ERRORE";
          detailsEl.innerText = "Nessuna risposta dal modello.";
        }
      } catch (err) {
        decisionEl.innerText = "ERRORE";
        detailsEl.innerText = err.message;
      } finally {
        btnAction.disabled = false;
        btnAction.innerText = "SCATTA E DECIDI";
      }
    };

    window.addEventListener('keydown', (e) => {
      if (
        e.code === 'Space' || 
        e.code === 'Enter' || 
        e.key === 'Enter' || 
        e.key === ' ' || 
        e.code.startsWith('Numpad') ||
        e.key === 'VolumeUp' || 
        e.key === 'VolumeDown'
      ) {
        e.preventDefault();
        if (!btnAction.disabled) {
          btnAction.click();
        }
      }
    });

    window.addEventListener('click', (e) => {
      if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON' && !btnAction.disabled) {
        btnAction.click();
      }
    });
  </script>
</body>
</html>
