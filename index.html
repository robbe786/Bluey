<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Poker Assistant 360°</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #121212; color: #fff; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    #camera-container { flex: 1 1 auto; min-height: 0; position: relative; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    #overlay-box { 
      position: absolute; 
      border: 2px dashed rgba(255,255,255,0.7); 
      width: 96%; 
      height: 52%; 
      pointer-events: none; 
      border-radius: 8px; 
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.6); 
    }
    
    #result-panel { flex: 0 0 auto; background: #1a1a1a; padding: 12px 16px 20px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; border-top: 2px solid #333; }
    #decision { font-size: 1.8rem; font-weight: 900; text-align: center; letter-spacing: 1px; color: #888; }
    #details { font-size: 0.9rem; color: #ccc; width: 100%; text-align: left; line-height: 1.45; min-height: 2.8em; word-break: break-word; }
    #btn-action { width: 100%; padding: 16px; font-size: 1.2rem; font-weight: bold; color: white; background: #2563eb; border: none; border-radius: 12px; cursor: pointer; touch-action: manipulation; }
    #btn-action:active { background: #1d4ed8; }
    #btn-action:disabled { background: #444; color: #888; cursor: not-allowed; }

    .poker-card {
      display: inline-block;
      font-weight: 800;
      padding: 1px 6px;
      margin: 0 2px;
      border-radius: 4px;
      background: #262626;
      border: 1px solid #404040;
      letter-spacing: 0.5px;
    }
    .card-d { color: #38bdf8 !important; }
    .card-c { color: #22c55e !important; }
    .card-h { color: #ef4444 !important; }
    .card-s { color: #f8fafc !important; }

    .status-raise { color: #3b82f6 !important; }
    .status-call { color: #10b981 !important; }
    .status-fold { color: #ef4444 !important; }

    #api-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: flex; justify-content: center; align-items: center; padding: 20px; z-index: 100; }
    .modal-content { background: #222; padding: 20px; border-radius: 12px; width: 100%; max-width: 350px; border: 1px solid #333; }
    .modal-content input { width: 100%; padding: 12px; margin: 12px 0; border-radius: 6px; border: 1px solid #444; background: #111; color: white; font-size: 0.95rem; }
    .modal-content button { width: 100%; padding: 12px; background: #2563eb; border: none; border-radius: 6px; color: white; font-weight: bold; font-size: 1rem; }
  </style>
</head>
<body>

  <div id="api-modal">
    <div class="modal-content">
      <h3 style="font-size: 1.1rem;">Inserisci Gemini API Key</h3>
      <input type="text" id="api-key-input" placeholder="Incolla chiave AQ...">
      <button id="save-key-btn">Salva e Avvia</button>
    </div>
  </div>

  <div id="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <div id="overlay-box"></div>
  </div>

  <div id="result-panel">
    <div id="decision">IN ATTESA</div>
    <div id="details">Inquadra il tavolo nel riquadro panoramico.</div>
    <button id="btn-action">SCATTA E DECIDI</button>
  </div>

  <canvas id="canvas" style="display: none;"></canvas>

  <script>
    const SYSTEM_PROMPT = `Sei un coach GTO istantaneo per Spin & Go PokerStars Aurora. Valori in "BB".
MAPPA VISIVA:
1. HERO: In basso al centro ('Bluey4'). Riconosci le due carte scoperte.
2. BOARD: Al centro esatto del tavolo (sopra la scritta Pot). Riporta tutte le carte scoperte (3-5 carte). Se pre-flop lascia stringa vuota "".
3. COLORI DEI SEMI (POKERSTARS 4-COLOR):
   - Quadri (d): BLU / CELESTE (rombo)
   - Fiori (c): VERDE SMERALDO (trifoglio)
   - Picche (s): NERO (foglia)
   - Cuori (h): ROSSO VIVO (cuore)
4. POSIZIONI (DEDUZIONE MATEMATICA):
   - Se 2 giocatori rimasti con stack -> HEADS-UP: Chi ha 0.5 BB (o nulla pre-flop) è BTN/SB; chi ha 1 BB è BB.
   - Se 3 giocatori -> 3-WAY: 1 BB a terra = BB; 0.5 BB = SB; 0 BB = BTN.
5. AZIONI AVVERSARI:
   - Scritta 'All In' o fiche >= 10 BB = ALL-IN.
   - 2-4 BB = RAISE. 1 BB = LIMP.

STRATEGIA RAPIDA:
- Contro All-In (>=10 BB): Call solo JJ+, QQ, KK, AA, AK. Fold il resto.
- Pre-flop non aperto <= 8 BB: Solo Push o Fold.
- Pre-flop non aperto > 8 BB: Raise 2 BB con buone mani, fold trash offsuit.
- Post-flop: Check/fold con deboli senza progetto.

RISPONDI ESCLUSIVAMENTE CON QUESTO SCHEMA JSON (senza markdown o spiegazioni esterne):
{
  "mossa": "AZIONE CON SIZING",
  "mie_carte": "Valore e seme Hero (es: 'Ah Kd')",
  "board": "Carte al centro o vuoto (es: '7c 8d Qs')",
  "dettaglio_tavolo": "N. Giocatori + Posizione + Stack effettivo + Azione"
}`;

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const btnAction = document.getElementById('btn-action');
    const decisionEl = document.getElementById('decision');
    const detailsEl = document.getElementById('details');
    const apiModal = document.getElementById('api-modal');
    const apiKeyInput = document.getElementById('api-key-input');
    const saveKeyBtn = document.getElementById('save-key-btn');

    let apiKey = localStorage.getItem('GEMINI_API_KEY') || '';

    if (apiKey) {
      apiModal.style.display = 'none';
      startCamera();
    }

    saveKeyBtn.onclick = () => {
      apiKey = apiKeyInput.value.trim();
      if (apiKey) {
        localStorage.setItem('GEMINI_API_KEY', apiKey);
        apiModal.style.display = 'none';
        startCamera();
      }
    };

    function formatPokerCards(cardString) {
      if (!cardString || typeof cardString !== 'string') return '';
      return cardString.replace(/\b([AKQJT0-9]{1,2})([shdc])\b/gi, (match, val, suit) => {
        const s = suit.toLowerCase();
        let suitSymbol = s;
        if (s === 'd') suitSymbol = '♦';
        else if (s === 'c') suitSymbol = '♣';
        else if (s === 'h') suitSymbol = '♥';
        else if (s === 's') suitSymbol = '♠';
        return `<span class="poker-card card-${s}">${val.toUpperCase()}${suitSymbol}</span>`;
      });
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { 
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920, min: 1280 },
            height: { ideal: 1080, min: 720 }
          },
          audio: false
        });

        video.srcObject = stream;
        video.setAttribute("playsinline", true);
        await video.play();
      } catch (err) {
        alert("Errore fotocamera: " + err.message);
      }
    }

    btnAction.onclick = async () => {
      if (!apiKey) {
        apiModal.style.display = 'flex';
        return;
      }

      if (!video.videoWidth) return;

      btnAction.disabled = true;
      btnAction.innerText = "SCATTO...";
      decisionEl.innerText = "ELABORAZIONE...";
      decisionEl.className = "";

      try {
        const srcWidth = video.videoWidth;
        const srcHeight = video.videoHeight;

        // Inquadratura panoramica al 52% per includere board centrale
        const cropW = srcWidth * 0.96;
        const cropH = srcHeight * 0.52;
        const cropX = (srcWidth - cropW) / 2;
        const cropY = (srcHeight - cropH) / 2;

        const targetWidth = 1400;
        canvas.width = targetWidth;
        canvas.height = (cropH / cropW) * targetWidth;

        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, canvas.width, canvas.height);
        const base64Image = canvas.toDataURL('image/jpeg', 0.80).split(',')[1];

        btnAction.innerText = "ANALISI...";

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system_instruction: { 
              parts: [{ text: SYSTEM_PROMPT }] 
            },
            contents: [{
              role: "user",
              parts: [
                { text: "Estrai le carte di Hero, il board, le posizioni ed emetti la decisione GTO in JSON." },
                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
              ]
            }],
            generationConfig: {
              response_mime_type: "application/json",
              temperature: 0.0,
              max_output_tokens: 800
            }
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message || "Errore API");

        // Estrazione sicura di tutte le parti di testo
        const parts = data.candidates?.[0]?.content?.parts || [];
        let outputText = "";
        for (const p of parts) {
          if (p.text && !p.thought) outputText += p.text;
        }
        if (!outputText && parts.length > 0 && parts[0].text) {
          outputText = parts[0].text;
        }

        if (outputText) {
          outputText = outputText.replace(/```json/gi, '').replace(/```/g, '').trim();
          let parsed;
          try {
            parsed = JSON.parse(outputText);
          } catch (e) {
            const mMatch = outputText.match(/"mossa"\s*:\s*"([^"]+)"/i);
            const cMatch = outputText.match(/"mie_carte"\s*:\s*"([^"]+)"/i);
            const bMatch = outputText.match(/"board"\s*:\s*"([^"]*)"/i);
            const dMatch = outputText.match(/"dettaglio_tavolo"\s*:\s*"([^"]+)"/i);

            if (mMatch) {
              parsed = {
                mossa: mMatch[1],
                mie_carte: cMatch ? cMatch[1] : "",
                board: bMatch ? bMatch[1] : "",
                dettaglio_tavolo: dMatch ? dMatch[1] : ""
              };
            } else {
              // Se fallisce, mostra la stringa reale restituita dall'AI per diagnosticarla subito
              parsed = { 
                mossa: "ERRORE PARSING", 
                mie_carte: "", 
                board: "", 
                dettaglio_tavolo: "Output ricevuto: " + outputText.slice(0, 160) 
              };
            }
          }

          decisionEl.innerText = parsed.mossa || "INFO";

          const coloredHero = parsed.mie_carte ? formatPokerCards(parsed.mie_carte) : 'NON RILEVATE';
          const coloredBoard = parsed.board ? formatPokerCards(parsed.board) : '<span style="color:#666;">Nessuno (Pre-Flop)</span>';

          detailsEl.innerHTML = `
            • <b>HERO:</b> [ ${coloredHero} ]<br>
            • <b>BOARD:</b> [ ${coloredBoard} ]<br>
            • ${parsed.dettaglio_tavolo || ''}
          `;

          const action = (parsed.mossa || '').toUpperCase();
          if (action.includes("ALL-IN") || action.includes("RAISE") || action.includes("SHOVE") || action.includes("PUSH")) {
            decisionEl.className = "status-raise";
          } else if (action.includes("CHECK") || action.includes("CALL")) {
            decisionEl.className = "status-call";
          } else if (action.includes("FOLD")) {
            decisionEl.className = "status-fold";
          } else {
            decisionEl.className = "";
          }
        } else {
          decisionEl.innerText = "ERRORE";
          detailsEl.innerText = "Risposta vuota dai server Google.";
        }
      } catch (err) {
        decisionEl.innerText = "ERRORE";
        detailsEl.innerText = err.message;
      } finally {
        btnAction.disabled = false;
        btnAction.innerText = "SCATTA E DECIDI";
      }
    };

    window.addEventListener('keydown', (e) => {
      if (
        e.code === 'Space' || 
        e.code === 'Enter' || 
        e.key === 'Enter' || 
        e.key === ' ' || 
        e.code.startsWith('Numpad') ||
        e.key === 'VolumeUp' || 
        e.key === 'VolumeDown'
      ) {
        e.preventDefault();
        if (!btnAction.disabled) btnAction.click();
      }
    });

    window.addEventListener('click', (e) => {
      if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON' && !btnAction.disabled) {
        btnAction.click();
      }
    });
  </script>
</body>
</html>
